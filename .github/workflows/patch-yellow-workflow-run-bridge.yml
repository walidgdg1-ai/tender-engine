name: Patch YELLOW Repair Workflow Bridge
# retrigger: regex patch, no nested Actions expressions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-yellow-workflow-run-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add workflow-run repair bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('.github/workflows/dce-fanout-v2.yml')
          s=p.read_text(encoding='utf-8')

          if 'workflows: ["Repair Open YELLOW DCEs"]' not in s:
              anchor="  push:\n    branches: [main]\n    paths:\n      - 'benchmarks/dce-throughput-trigger.json'\n"
              repl=anchor + '  workflow_run:\n    workflows: ["Repair Open YELLOW DCEs"]\n    types: [completed]\n'
              if anchor not in s:
                  raise SystemExit('on.push anchor missing')
              s=s.replace(anchor,repl,1)

          if '          EVENT_NAME:' not in s:
              m=re.search(r'(?m)^(\s*SELECTION_PATH:.*)$',s)
              if not m:
                  raise SystemExit('SELECTION_PATH env anchor missing')
              actions_expr='$' + '{{ github.event_name }}'
              s=s[:m.end()] + '\n          EVENT_NAME: ' + actions_expr + s[m.end():]

          if 'Workflow-run bridge: selection=' not in s:
              old='          set -euo pipefail\n          source_tag="discovery-harvest-${SOURCE_RUN}"\n'
              new='''          set -euo pipefail
          if [ "${EVENT_NAME:-}" = "workflow_run" ]; then
            SELECTION_PATH='control/yellow_repair_request.json'
            SOURCE_RUN="$(python - <<'PY2'
          import json
          x=json.load(open('control/yellow_repair_request.json',encoding='utf-8'))
          print(x.get('source_discovery_run') or '')
          PY2
          )"
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo 'Invalid YELLOW repair source run' >&2; exit 1; }
            echo "Workflow-run bridge: selection=$SELECTION_PATH source_run=$SOURCE_RUN"
          fi
          source_tag="discovery-harvest-${SOURCE_RUN}"
'''
              if old not in s:
                  raise SystemExit('prepare shell anchor missing')
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          y=Path('.github/workflows/yellow-repair-dce.yml')
          t=y.read_text(encoding='utf-8')
          marker='      - name: Dispatch fresh DCE repair fanout\n'
          if marker in t:
              pos=t.index(marker)
              t=t[:pos] + '''      - name: Finish via workflow-run bridge
        run: |
          echo 'Repair request persisted. DCE Fanout V2 will start from this successful workflow completion without workflow-dispatch API usage.'
'''
          y.write_text(t,encoding='utf-8')

          d=p.read_text(encoding='utf-8')
          ytxt=y.read_text(encoding='utf-8')
          assert 'workflows: ["Repair Open YELLOW DCEs"]' in d
          assert '          EVENT_NAME:' in d
          assert 'Workflow-run bridge: selection=' in d
          assert 'Finish via workflow-run bridge' in ytxt
          assert 'gh workflow run dce-fanout-v2.yml' not in ytxt
          print('bridge patch structural checks OK')
          PY
      - name: Persist bridge patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add .github/workflows/dce-fanout-v2.yml .github/workflows/yellow-repair-dce.yml
          git commit -m 'fix: trigger YELLOW DCE repair through workflow-run bridge' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((i*2))"
          done
          exit 1
