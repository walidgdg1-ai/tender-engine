name: GPT HOT Evidence Extract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpt-hot-evidence-extract.yml'

permissions:
  contents: write

concurrency:
  group: gpt-hot-evidence-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover HOT source assets and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: walidgdg1-ai/tender-engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hot-evidence && mkdir -p /tmp/hot-evidence
          python - <<'PY' > /tmp/hot-sources.tsv
          import json
          idx=json.load(open('control/gpt_review_priority_extract.json',encoding='utf-8'))
          hot=[x for x in idx.get('items',[]) if str(x.get('spm_fit_band','')).upper()=='HOT']
          open('/tmp/hot-items.json','w',encoding='utf-8').write(json.dumps(hot,ensure_ascii=False,indent=2))
          for x in hot:
              print(f"{x['source_dce_run_id']}\t{x['source_shard']}\t{x['candidate_id']}")
          PY

          download_asset() {
            local rel_json="$1" name="$2" out="$3"
            local aid
            aid="$(jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id' "$rel_json" | head -n1)"
            if [ -z "$aid" ] || [ "$aid" = null ]; then
              echo "asset missing: $name"
              return 1
            fi
            echo "asset $name id=$aid"
            gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$aid" > "$out"
            test -s "$out"
          }

          while IFS=$'\t' read -r run shard cid; do
            d="/tmp/hot-evidence/$run"
            mkdir -p "$d"
            rel="$d/release.json"
            tag="dce-harvest-$run"
            echo "Recovering $cid from $tag shard=$shard"
            gh api "repos/$GH_REPO/releases/tags/$tag" > "$rel"

            download_asset "$rel" "fast-adjudication-shard-$shard.jsonl" "$d/fast-adjudication-shard-$shard.jsonl" || true
            download_asset "$rel" 'dce-canonical-packs-manifest.json' "$d/dce-canonical-packs-manifest.json" || true
            download_asset "$rel" "gpt-supergreen-inbox-$run.json" "$d/gpt-supergreen-inbox-$run.json" || true
            download_asset "$rel" "dce-deep-review-$run.tar.gz" "$d/dce-deep-review-$run.tar.gz" || true

            if [ -s "$d/dce-deep-review-$run.tar.gz" ]; then
              mkdir -p "$d/deep"
              tar -xzf "$d/dce-deep-review-$run.tar.gz" -C "$d/deep" || true
            fi
            echo "Recovered files for $run: $(find "$d" -type f | wc -l)"
          done < /tmp/hot-sources.tsv

          python - <<'PY'
          import json, pathlib, re
          hot=json.load(open('/tmp/hot-items.json',encoding='utf-8'))
          root=pathlib.Path('/tmp/hot-evidence')
          out=[]

          def read_text(p, limit=160000):
              try:
                  if p.stat().st_size > 15_000_000: return ''
                  return p.read_text(encoding='utf-8',errors='ignore')[:limit]
              except Exception: return ''

          def object_hits(v, needles, found, cap=30):
              if len(found)>=cap: return
              if isinstance(v,dict):
                  raw=json.dumps(v,ensure_ascii=False)
                  if any(n and n in raw for n in needles):
                      found.append(v); return
                  for z in v.values(): object_hits(z,needles,found,cap)
              elif isinstance(v,list):
                  for z in v: object_hits(z,needles,found,cap)

          for x in hot:
              run=str(x['source_dce_run_id']); shard=str(x['source_shard']); cid=str(x['candidate_id'])
              d=root/run
              row=None
              fp=d/f'fast-adjudication-shard-{shard}.jsonl'
              if fp.exists():
                  for line in fp.read_text(encoding='utf-8',errors='ignore').splitlines():
                      if cid not in line: continue
                      try: row=json.loads(line)
                      except Exception: pass
                      if row is not None: break

              needles=[cid,cid.split(':',1)[-1]]
              manifest_hits=[]; inbox_hits=[]
              mp=d/'dce-canonical-packs-manifest.json'
              if mp.exists():
                  try: object_hits(json.load(open(mp,encoding='utf-8')),needles,manifest_hits)
                  except Exception as e: manifest_hits=[{'parse_error':str(e)}]
              ip=d/f'gpt-supergreen-inbox-{run}.json'
              if ip.exists():
                  try: object_hits(json.load(open(ip,encoding='utf-8')),needles,inbox_hits)
                  except Exception as e: inbox_hits=[{'parse_error':str(e)}]

              title=str(x.get('title') or '')
              text_needles=needles+[title]+re.findall(r'[A-Za-zÀ-ž0-9_-]{7,}',title)[:8]
              deep_hits=[]
              deep=d/'deep'
              if deep.exists():
                  for p in deep.rglob('*'):
                      if not p.is_file(): continue
                      txt=read_text(p)
                      hay=(str(p)+'\n'+txt).lower()
                      if any(n and n.lower() in hay for n in text_needles[:6]):
                          deep_hits.append({'path':str(p.relative_to(deep)),'size':p.stat().st_size,'text':txt[:80000]})
                          if len(deep_hits)>=20: break

              out.append({
                  'candidate':x,
                  'fast_adjudication_row':row,
                  'canonical_manifest_hits':manifest_hits,
                  'gpt_inbox_hits':inbox_hits,
                  'deep_review_hits':deep_hits,
                  'source_files':sorted(str(p.relative_to(d)) for p in d.rglob('*') if p.is_file())[:1000]
              })

          payload={'schema':'GPT_HOT_EVIDENCE_BUNDLE_V3','count':len(out),'items':out}
          pathlib.Path('control/gpt_hot_evidence_bundle.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
            'items':len(out),
            'fast_rows':sum(bool(x['fast_adjudication_row']) for x in out),
            'manifest_hits':sum(len(x['canonical_manifest_hits']) for x in out),
            'inbox_hits':sum(len(x['gpt_inbox_hits']) for x in out),
            'deep_hits':sum(len(x['deep_review_hits']) for x in out),
            'source_files':sum(len(x['source_files']) for x in out)
          },indent=2))
          PY
      - name: Persist evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/gpt_hot_evidence_bundle.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "review: persist HOT DCE evidence ${GITHUB_RUN_ID}"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep "$((n*2))"
          done
          exit 1
