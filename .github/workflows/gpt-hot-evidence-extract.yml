name: GPT HOT Evidence Extract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpt-hot-evidence-extract.yml'

permissions:
  contents: write

concurrency:
  group: gpt-hot-evidence-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover HOT source assets and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hot-evidence && mkdir -p /tmp/hot-evidence
          python - <<'PY'
          import json, pathlib
          idx=json.load(open('control/gpt_review_priority_extract.json',encoding='utf-8'))
          hot=[x for x in idx.get('items',[]) if str(x.get('spm_fit_band','')).upper()=='HOT']
          pathlib.Path('/tmp/hot-items.json').write_text(json.dumps(hot,ensure_ascii=False,indent=2),encoding='utf-8')
          for x in hot:
              print(f"{x['source_dce_run_id']}\t{x['source_shard']}\t{x['candidate_id']}")
          PY
          python - <<'PY' > /tmp/hot-sources.tsv
          import json
          hot=json.load(open('/tmp/hot-items.json'))
          for x in hot:
              print(f"{x['source_dce_run_id']}\t{x['source_shard']}\t{x['candidate_id']}")
          PY
          while IFS=$'\t' read -r run shard cid; do
            d="/tmp/hot-evidence/$run"
            mkdir -p "$d"
            gh release download "dce-harvest-$run" --pattern "fast-adjudication-shard-$shard.jsonl" --dir "$d" >/dev/null 2>&1 || true
            if [ ! -f "$d/dce-canonical-packs-manifest.json" ]; then
              gh release download "dce-harvest-$run" --pattern 'dce-canonical-packs-manifest.json' --dir "$d" >/dev/null 2>&1 || true
            fi
            if [ ! -f "$d/deep.tar.gz" ]; then
              gh release download "dce-harvest-$run" --pattern "dce-deep-review-$run.tar.gz" --dir "$d" >/dev/null 2>&1 || true
              [ -f "$d/dce-deep-review-$run.tar.gz" ] && mv "$d/dce-deep-review-$run.tar.gz" "$d/deep.tar.gz" || true
              if [ -f "$d/deep.tar.gz" ]; then
                mkdir -p "$d/deep"
                tar -xzf "$d/deep.tar.gz" -C "$d/deep" || true
              fi
            fi
          done < /tmp/hot-sources.tsv

          python - <<'PY'
          import json, pathlib, re
          hot=json.load(open('/tmp/hot-items.json'))
          root=pathlib.Path('/tmp/hot-evidence')
          out=[]
          def read_text(p):
              try:
                  if p.stat().st_size>8_000_000: return ''
                  return p.read_text(encoding='utf-8',errors='ignore')
              except Exception: return ''
          def snippets(text, needles, radius=3500, cap=24000):
              spans=[]
              low=text.lower()
              for n in needles:
                  if not n: continue
                  i=low.find(n.lower())
                  if i>=0: spans.append(text[max(0,i-radius):min(len(text),i+len(n)+radius)])
              s='\n\n--- HIT ---\n\n'.join(spans)
              return s[:cap]
          for x in hot:
              run=str(x['source_dce_run_id']); shard=str(x['source_shard']); cid=x['candidate_id']
              d=root/run
              row=None
              fp=d/f'fast-adjudication-shard-{shard}.jsonl'
              if fp.exists():
                  for line in fp.read_text(encoding='utf-8',errors='ignore').splitlines():
                      try: obj=json.loads(line)
                      except: continue
                      if str(obj.get('candidate_id') or (obj.get('raw') or {}).get('candidate_id') or '')==cid:
                          row=obj; break
                      if cid in line:
                          row=obj; break
              manifest_hits=[]
              mp=d/'dce-canonical-packs-manifest.json'
              if mp.exists():
                  try:
                      m=json.load(open(mp,encoding='utf-8'))
                      stack=[m]
                      while stack:
                          v=stack.pop()
                          if isinstance(v,dict):
                              if cid in json.dumps(v,ensure_ascii=False): manifest_hits.append(v)
                              else: stack.extend(v.values())
                          elif isinstance(v,list): stack.extend(v)
                      manifest_hits=manifest_hits[:20]
                  except Exception as e: manifest_hits=[{'parse_error':str(e)}]
              title=x.get('title','')
              tokens=[cid, cid.split(':',1)[-1], title]
              for w in re.findall(r'[A-Za-zÀ-ž0-9_-]{5,}',title)[:8]: tokens.append(w)
              deep_hits=[]
              deep=d/'deep'
              if deep.exists():
                  for p in deep.rglob('*'):
                      if not p.is_file(): continue
                      path_hit=any(n and n.lower() in str(p).lower() for n in tokens[:3])
                      txt=read_text(p)
                      content_hit=any(n and n.lower() in txt.lower() for n in tokens[:3]) if txt else False
                      if path_hit or content_hit:
                          deep_hits.append({'path':str(p.relative_to(deep)),'size':p.stat().st_size,'text':txt[:50000]})
                          if len(deep_hits)>=12: break
              out.append({
                  'candidate':x,
                  'fast_adjudication_row':row,
                  'canonical_manifest_hits':manifest_hits,
                  'deep_review_hits':deep_hits,
                  'source_files':sorted(str(p.relative_to(d)) for p in d.rglob('*') if p.is_file())[:500]
              })
          payload={'schema':'GPT_HOT_EVIDENCE_BUNDLE_V1','count':len(out),'items':out}
          pathlib.Path('control/gpt_hot_evidence_bundle.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'items':len(out),'fast_rows':sum(bool(x['fast_adjudication_row']) for x in out),'deep_hits':sum(len(x['deep_review_hits']) for x in out)},indent=2))
          PY
      - name: Persist evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/gpt_hot_evidence_bundle.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "review: persist HOT DCE evidence ${GITHUB_RUN_ID}"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep "$((n*2))"
          done
          exit 1
