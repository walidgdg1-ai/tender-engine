name: GPT HOT Evidence Extract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpt-hot-evidence-extract.yml'

permissions:
  contents: write

concurrency:
  group: gpt-hot-evidence-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover HOT source assets and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: walidgdg1-ai/tender-engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hot-evidence && mkdir -p /tmp/hot-evidence
          python - <<'PY' > /tmp/hot-sources.tsv
          import json
          idx=json.load(open('control/gpt_review_priority_extract.json',encoding='utf-8'))
          hot=[x for x in idx.get('items',[]) if str(x.get('spm_fit_band','')).upper()=='HOT']
          open('/tmp/hot-items.json','w',encoding='utf-8').write(json.dumps(hot,ensure_ascii=False,indent=2))
          for x in hot:
              print(f"{x['source_dce_run_id']}\t{x['source_shard']}\t{x['candidate_id']}")
          PY

          while IFS=$'\t' read -r run shard cid; do
            d="/tmp/hot-evidence/$run"
            mkdir -p "$d"
            tag="dce-harvest-$run"
            echo "Recovering $cid from $tag shard=$shard"
            gh release view "$tag" --repo "$GH_REPO" --json tagName >/dev/null

            # Recover every fast-adjudication shard for this source run. This avoids
            # trusting a stale shard locator and lets the parser resolve by candidate_id.
            gh release download "$tag" --repo "$GH_REPO" \
              --pattern 'fast-adjudication-shard-*.jsonl' --dir "$d" --clobber

            gh release download "$tag" --repo "$GH_REPO" \
              --pattern 'dce-canonical-packs-manifest.json' --dir "$d" --clobber || true

            gh release download "$tag" --repo "$GH_REPO" \
              --pattern "dce-deep-review-$run.tar.gz" --dir "$d" --clobber || true
            if [ -f "$d/dce-deep-review-$run.tar.gz" ]; then
              mkdir -p "$d/deep"
              tar -xzf "$d/dce-deep-review-$run.tar.gz" -C "$d/deep" || true
            fi
            echo "Recovered files for $run: $(find "$d" -type f | wc -l)"
          done < /tmp/hot-sources.tsv

          python - <<'PY'
          import json, pathlib, re
          hot=json.load(open('/tmp/hot-items.json',encoding='utf-8'))
          root=pathlib.Path('/tmp/hot-evidence')
          out=[]

          def read_text(p, limit=120000):
              try:
                  if p.stat().st_size > 12_000_000: return ''
                  return p.read_text(encoding='utf-8',errors='ignore')[:limit]
              except Exception: return ''

          for x in hot:
              run=str(x['source_dce_run_id']); cid=str(x['candidate_id'])
              d=root/run
              row=None; row_file=None
              for fp in sorted(d.glob('fast-adjudication-shard-*.jsonl')):
                  for line in fp.read_text(encoding='utf-8',errors='ignore').splitlines():
                      if cid not in line: continue
                      try: obj=json.loads(line)
                      except Exception: continue
                      row=obj; row_file=fp.name; break
                  if row is not None: break

              manifest_hits=[]
              mp=d/'dce-canonical-packs-manifest.json'
              if mp.exists():
                  try:
                      m=json.load(open(mp,encoding='utf-8'))
                      stack=[m]
                      while stack:
                          v=stack.pop()
                          if isinstance(v,dict):
                              raw=json.dumps(v,ensure_ascii=False)
                              if cid in raw or cid.split(':',1)[-1] in raw:
                                  manifest_hits.append(v)
                              else:
                                  stack.extend(v.values())
                          elif isinstance(v,list): stack.extend(v)
                      manifest_hits=manifest_hits[:20]
                  except Exception as e:
                      manifest_hits=[{'parse_error':str(e)}]

              title=str(x.get('title') or '')
              needles=[cid,cid.split(':',1)[-1],title]
              needles += re.findall(r'[A-Za-zÀ-ž0-9_-]{6,}',title)[:10]
              deep_hits=[]
              deep=d/'deep'
              if deep.exists():
                  for p in deep.rglob('*'):
                      if not p.is_file(): continue
                      txt=read_text(p)
                      hay=(str(p)+'\n'+txt).lower()
                      if any(n and n.lower() in hay for n in needles[:5]):
                          deep_hits.append({'path':str(p.relative_to(deep)),'size':p.stat().st_size,'text':txt[:60000]})
                          if len(deep_hits)>=16: break

              out.append({
                  'candidate':x,
                  'fast_adjudication_source_file':row_file,
                  'fast_adjudication_row':row,
                  'canonical_manifest_hits':manifest_hits,
                  'deep_review_hits':deep_hits,
                  'source_files':sorted(str(p.relative_to(d)) for p in d.rglob('*') if p.is_file())[:1000]
              })

          payload={'schema':'GPT_HOT_EVIDENCE_BUNDLE_V2','count':len(out),'items':out}
          pathlib.Path('control/gpt_hot_evidence_bundle.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
            'items':len(out),
            'fast_rows':sum(bool(x['fast_adjudication_row']) for x in out),
            'manifest_hits':sum(len(x['canonical_manifest_hits']) for x in out),
            'deep_hits':sum(len(x['deep_review_hits']) for x in out),
            'source_files':sum(len(x['source_files']) for x in out)
          },indent=2))
          PY
      - name: Persist evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/gpt_hot_evidence_bundle.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "review: persist HOT DCE evidence ${GITHUB_RUN_ID}"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep "$((n*2))"
          done
          exit 1
