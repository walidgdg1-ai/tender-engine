name: GPT Gate Stress Surface

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/build_gpt_gate_stress_batches.py'
      - '.github/workflows/gpt-gate-stress-surface.yml'
      - 'control/gpt_gate_stress_trigger.json'
  workflow_run:
    workflows: ["GPT Review Full Historical Backfill"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: gpt-gate-stress-surface
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mark stress run started
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p={
            'schema':'GPT_GATE_STRESS_STATUS_V2_DEDICATED_BRANCH',
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'status':'RUNNING',
            'started_at':datetime.now(timezone.utc).isoformat(),
            'head_sha':os.environ.get('GITHUB_SHA'),
            'surface_ref':'gpt-stress-current',
          }
          open('control/gpt_gate_stress_status.json','w',encoding='utf-8').write(json.dumps(p,indent=2)+'\n')
          PY
          git add control/gpt_gate_stress_status.json
          git commit -m "stress: mark gate review running ${GITHUB_RUN_ID}" || true
          git push origin HEAD:main || true

      - name: Recover exact DCE shards referenced by current BUSINESS_GATES
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gpt-gate-stress-releases
          mkdir -p /tmp/gpt-gate-stress-releases
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('control/gpt_review_index.json',encoding='utf-8'))
          rows=[x for x in p.get('items',[]) if isinstance(x,dict) and str(x.get('review_stage') or '').upper()=='BUSINESS_GATES' and bool(x.get('gate_readiness'))]
          if not rows:
              raise SystemExit('No BUSINESS_GATES rows in durable review index')
          pairs=sorted({(int(x.get('source_dce_run_id') or 0), int(x.get('source_shard') or 0)) for x in rows if int(x.get('source_dce_run_id') or 0)})
          lines=[]
          for run_id, shard in pairs:
              dest=Path('/tmp/gpt-gate-stress-releases')/str(run_id)/f'fast-adjudication-shard-{shard}.jsonl'
              url=f'https://github.com/walidgdg1-ai/tender-engine/releases/download/dce-harvest-{run_id}/fast-adjudication-shard-{shard}.jsonl'
              lines.append(f'{run_id}\t{shard}\t{url}\t{dest}')
          Path('/tmp/gate-downloads.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(json.dumps({
              'business_gate_rows':len(rows),
              'exact_run_shard_pairs':len(pairs),
              'release_runs':len({r for r,_ in pairs}),
              'transport':'PUBLIC_RELEASE_ASSET_URLS_NO_GITHUB_REST_API'
          },indent=2))
          PY

          cat /tmp/gate-downloads.tsv | xargs -P 16 -n 4 bash -c '
            set -euo pipefail
            run_id="$1"; shard="$2"; url="$3"; dest="$4"
            mkdir -p "$(dirname "$dest")"
            tmp="${dest}.part"
            rm -f "$tmp"
            fetch() {
              curl -fL --silent --show-error \
                --connect-timeout 15 \
                --max-time 180 \
                --retry 6 \
                --retry-all-errors \
                --retry-delay 2 \
                -o "$tmp" "$1"
            }
            if ! fetch "$url"; then
              # The direct YELLOW repair release uses a semantic asset name. Its
              # parser intentionally maps that file to shard 0; preserve that
              # locator contract by materializing it locally as shard-0.
              if [ "$shard" = "0" ]; then
                alt="https://github.com/walidgdg1-ai/tender-engine/releases/download/dce-harvest-${run_id}/fast-adjudication-shard-yellow-repair.jsonl"
                echo "canonical shard-0 absent for run=$run_id; trying repair alias" >&2
                rm -f "$tmp"
                fetch "$alt"
              else
                exit 1
              fi
            fi
            test -s "$tmp"
            mv "$tmp" "$dest"
          ' _

          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/gate-downloads.tsv').read_text().splitlines()
          missing=[]
          for line in lines:
              run_id,shard,_url,dest=line.split('\t')
              p=Path(dest)
              if not p.is_file() or p.stat().st_size==0:
                  missing.append(f'{run_id}:{shard}')
          print(f'exact_shards_expected={len(lines)} missing={len(missing)}')
          if missing:
              print('missing_pairs=',missing[:100])
              raise SystemExit(2)
          PY

      - name: Build exhaustive evidence surface and enforce conservation
        run: |
          set -euo pipefail
          python pipeline/build_gpt_gate_stress_batches.py \
            --index control/gpt_review_index.json \
            --release-root /tmp/gpt-gate-stress-releases \
            --out-dir control/gpt_gate_stress_batches \
            --batch-size 10 \
            --triage-batch-size 50

      - name: Build one-line-per-gate assistant catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, re
          from pathlib import Path
          root=Path('control/gpt_gate_stress_batches')
          rows=[]
          for path in sorted(glob.glob(str(root/'triage-*.json'))):
              data=json.load(open(path,encoding='utf-8'))
              rows.extend(x for x in data.get('items',[]) if isinstance(x,dict))
          manifest=json.load(open(root/'manifest.json',encoding='utf-8'))
          expected=int(manifest.get('business_gates_in_index') or 0)
          if len(rows)!=expected:
              raise SystemExit(f'catalog conservation fail rows={len(rows)} expected={expected}')
          ids=[str(x.get('candidate_id') or '').strip().casefold() for x in rows]
          if len(ids)!=len(set(ids)):
              raise SystemExit('catalog duplicate candidate ids')
          def clean(v, limit):
              s=re.sub(r'\s+',' ',str(v or '')).strip().replace('\t',' ')
              return s[:limit]
          out=['rank\tcandidate_id\ttitle\tbuyer\tdeadline\tvalue\tcurrency\tband\treasons\tscope_dce\tterm_value_dce\tdeep_batch']
          for i,x in enumerate(rows,1):
              fields=[i,clean(x.get('candidate_id'),180),clean(x.get('title'),260),clean(x.get('buyer'),180),clean(x.get('deadline'),80),clean(x.get('estimated_value'),40),clean(x.get('currency'),20),clean(x.get('spm_fit_band'),30),clean(','.join(str(y) for y in (x.get('spm_fit_reasons') or [])),160),clean(x.get('scope_dce'),500),clean(x.get('term_value_dce'),300),clean(x.get('deep_batch_hint'),40)]
              out.append('\t'.join(map(str,fields)))
          (root/'catalog.tsv').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(f'catalog rows={len(rows)}')
          PY

      - name: Persist exhaustive surface on contention-free branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add -A control/gpt_gate_stress_batches
          git commit -m "stress: persist exhaustive gate surface ${GITHUB_RUN_ID}" || true
          git push --force origin HEAD:refs/heads/gpt-stress-current

      - name: Persist terminal stress status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p={
            'schema':'GPT_GATE_STRESS_STATUS_V2_DEDICATED_BRANCH',
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'status':str(os.environ.get('JOB_STATUS') or 'unknown').upper(),
            'finished_at':datetime.now(timezone.utc).isoformat(),
            'head_sha':os.environ.get('GITHUB_SHA'),
            'surface_ref':'gpt-stress-current',
            'contract':'Large exhaustive evidence surface persists on gpt-stress-current so high-frequency main writes cannot starve it.'
          }
          open('control/gpt_gate_stress_status.json','w',encoding='utf-8').write(json.dumps(p,indent=2)+'\n')
          PY
          git add control/gpt_gate_stress_status.json
          git commit -m "stress: mark gate review ${JOB_STATUS} ${GITHUB_RUN_ID}" || exit 0
          for n in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((n*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*2))
          done
          exit 0
