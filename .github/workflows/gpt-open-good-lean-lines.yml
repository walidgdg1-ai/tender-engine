name: GPT Open GOOD Lean Lines
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpt-open-good-lean-lines.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import json,pathlib
          p=json.load(open('control/gpt_open_good_lean_top.json',encoding='utf-8'))
          lines=['rank\tlean\tpostdce\tdeadline\tvalue\tcandidate_id\ttitle\trun\tshard']
          for i,x in enumerate(p.get('items',[]),1):
            lines.append('\t'.join(str(v if v is not None else '') for v in [i,x.get('lean_open_score'),x.get('spm_post_dce_score'),x.get('deadline'),x.get('estimated_value'),x.get('candidate_id'),x.get('title'),x.get('source_dce_run_id'),x.get('source_shard')]))
          pathlib.Path('control/gpt_open_good_lean_lines.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - run: |
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/gpt_open_good_lean_lines.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "review: persist one-line open GOOD view ${GITHUB_RUN_ID}"
          for n in 1 2 3 4 5; do git push origin HEAD:main && exit 0 || true; git pull --rebase origin main; sleep $((n*2)); done
          exit 1
