name: API-Free GPT Review Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/build_api_free_recovery_surface.py'
      - '.github/workflows/api-free-review-recovery.yml'

permissions:
  contents: write

concurrency:
  group: api-free-gpt-review-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build recovery surface without GitHub API calls
        run: python pipeline/build_api_free_recovery_surface.py
      - name: Persist recovery outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/gpt_api_free_recovery_surface.json \
                  control/gpt_api_free_recovery_summary.json \
                  control/api_free_recovery/business_gates_all.jsonl
          git commit -m "recovery: rebuild API-free GPT surface ${GITHUB_RUN_ID}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((i*2))"
          done
          exit 1
