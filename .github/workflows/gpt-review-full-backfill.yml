name: GPT Review Full Historical Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/gpt_review_full_backfill_trigger.json'
  workflow_run:
    workflows: ["Direct YELLOW DCE Repair V2"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: gpt-review-full-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install recovery dependency
        run: python -m pip install --disable-pip-version-check -q requests

      - name: Recover DCE fast-adjudication evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/dce-review-full
          rm -rf "$root"
          mkdir -p "$root"

          if [ "${EVENT_NAME:-}" = "workflow_run" ]; then
            # Post-repair refresh is intentionally incremental. build_gpt_review_index.py
            # merges the existing durable uncapped index with these new source rows, and
            # rebuild_gpt_review_bank_from_release.py does the same for the visible hot
            # surface. Re-downloading 500+ historical releases would waste API quota and
            # cannot improve the result here.
            rid="${PARENT_RUN_ID:-}"
            [[ "$rid" =~ ^[0-9]+$ ]] || { echo "Invalid parent run id: $rid" >&2; exit 1; }
            dir="$root/$rid"
            mkdir -p "$dir"
            asset='fast-adjudication-shard-yellow-repair.jsonl'
            url="https://github.com/walidgdg1-ai/tender-engine/releases/download/dce-harvest-${rid}/${asset}"
            curl -fL --silent --show-error \
              --connect-timeout 15 --max-time 180 \
              --retry 12 --retry-all-errors --retry-delay 3 \
              -o "$dir/$asset" "$url"
            test -s "$dir/$asset"
            echo INCREMENTAL_POST_YELLOW_REPAIR > /tmp/dce-refresh-mode.txt
            echo 1 > /tmp/dce-release-count.txt
            echo 1 > /tmp/dce-shard-count.txt
            echo "$rid" > /tmp/dce-refresh-run-id.txt
            echo "Recovered post-repair DCE release=$rid via public release CDN"
          else
            # Explicit manual/full-audit mode keeps the historical sweep contract.
            # It is not used by the automatic post-repair chain.
            mapfile -t tags < <(
              gh release list --limit 5000 --json tagName \
                --jq '.[] | select(.tagName | startswith("dce-harvest-")) | .tagName'
            )
            if [ "${#tags[@]}" -eq 0 ]; then
              echo 'No durable DCE releases found.' >&2
              exit 1
            fi
            printf '%s\n' "${tags[@]}" > /tmp/dce-release-tags.txt
            export root
            cat /tmp/dce-release-tags.txt | xargs -r -P 6 -I{} bash -c '
              tag="$1"
              rid="${tag#dce-harvest-}"
              dir="$root/$rid"
              mkdir -p "$dir"
              gh release download "$tag" \
                --pattern "fast-adjudication-shard-*.jsonl" \
                --dir "$dir" >/dev/null 2>&1 || true
            ' _ {}
            release_count="${#tags[@]}"
            shard_count="$(find "$root" -type f -name 'fast-adjudication-shard-*.jsonl' | wc -l | tr -d ' ')"
            test "$shard_count" -gt 0
            echo FULL_HISTORICAL_AUDIT > /tmp/dce-refresh-mode.txt
            printf '%s\n' "$release_count" > /tmp/dce-release-count.txt
            printf '%s\n' "$shard_count" > /tmp/dce-shard-count.txt
            echo 0 > /tmp/dce-refresh-run-id.txt
            echo "Recovered DCE releases=$release_count fast_adjudication_shards=$shard_count"
          fi

      - name: Rebuild durable index, enlarged review surface and assistant batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'

          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main

            python pipeline/merge_gpt_adjudications_into_final_bank.py
            python pipeline/build_gpt_review_index.py \
              --release-root /tmp/dce-review-full \
              --existing control/gpt_review_index.json \
              --final-bank control/final_supergreen_bank.json \
              --review-ledger control/gpt_web_review_ledger.json \
              --out control/gpt_review_index.json

            python pipeline/rebuild_gpt_review_bank_from_release.py \
              --release-root /tmp/dce-review-full \
              --existing control/gpt_review_hot.json \
              --out control/gpt_review_hot.json \
              --max-items 1000

            GH_TOKEN='' GITHUB_TOKEN='' python pipeline/refresh_gpt_inbox_live.py \
              --existing control/gpt_supergreen_inbox.json \
              --final-bank control/final_supergreen_bank.json \
              --hot-green control/supergreen_hot.json \
              --hot-review control/gpt_review_hot.json \
              --review-ledger control/gpt_web_review_ledger.json \
              --out control/gpt_supergreen_inbox.json \
              --max-items 1000

            rm -rf control/gpt_web_read_batches
            python pipeline/build_gpt_web_read_batches.py \
              --inbox control/gpt_supergreen_inbox.json \
              --provenance-overrides control/gpt_provenance_overrides.json \
              --out-dir control/gpt_web_read_batches \
              --batch-size 25

            python pipeline/build_live_business_review_batch.py \
              --inbox control/gpt_supergreen_inbox.json \
              --final-bank control/final_supergreen_bank.json \
              --ledger control/gpt_web_review_ledger.json \
              --out control/gpt_live_review_batch.json \
              --max-items 100

            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          idx=json.load(open('control/gpt_review_index.json',encoding='utf-8'))
          inbox=json.load(open('control/gpt_supergreen_inbox.json',encoding='utf-8'))
          mode=Path('/tmp/dce-refresh-mode.txt').read_text().strip()
          release_count=int(Path('/tmp/dce-release-count.txt').read_text().strip())
          shard_count=int(Path('/tmp/dce-shard-count.txt').read_text().strip())
          refresh_run=int(Path('/tmp/dce-refresh-run-id.txt').read_text().strip())
          previous={}
          try:
              previous=json.load(open('control/gpt_review_backfill_state.json',encoding='utf-8'))
          except Exception:
              pass
          payload={
              'schema':'GPT_REVIEW_BACKFILL_STATE_V3_INCREMENTAL_SAFE',
              'updated_at':datetime.now(timezone.utc).isoformat(),
              'backfill_complete':True,
              'refresh_mode':mode,
              'source_dce_run_id_this_refresh':refresh_run or None,
              'dce_releases_recovered_this_refresh':release_count,
              'fast_adjudication_shards_recovered_this_refresh':shard_count,
              'previous_full_dce_releases_enumerated':previous.get('dce_releases_enumerated') or previous.get('previous_full_dce_releases_enumerated'),
              'previous_full_fast_adjudication_shards_recovered':previous.get('fast_adjudication_shards_recovered') or previous.get('previous_full_fast_adjudication_shards_recovered'),
              'review_index_count_after_backfill':int(idx.get('count') or 0),
              'review_index_counts_after_backfill':idx.get('counts') or {},
              'index_recovery_this_refresh':idx.get('recovery') or {},
              'visible_inbox_after_backfill':len(inbox.get('review_queue') or []),
              'contract':'Durable index merge. Automatic post-YELLOW-repair refresh ingests only the newly published repair release because the existing uncapped index is preserved. YELLOW remains non-terminal; missing evidence remains UNKNOWN. Exhaustive BUSINESS_GATES stress follows by workflow_run.',
          }
          Path('control/gpt_review_backfill_state.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY

            git add \
              control/final_supergreen_bank.json \
              control/gpt_review_index.json \
              control/gpt_review_hot.json \
              control/gpt_supergreen_inbox.json \
              control/gpt_live_review_batch.json \
              control/gpt_review_backfill_state.json
            git add -A control/gpt_web_read_batches

            if git diff --cached --quiet; then
              echo 'GPT review universe already current.'
              break
            fi

            git commit -m "review: merge DCE review refresh ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$n" -eq 6 ]; then
              echo 'Failed to persist GPT review refresh after retries.' >&2
              exit 1
            fi
            sleep "$((n * 2))"
          done

      - name: Note downstream BUSINESS_GATES chain
        shell: bash
        run: |
          echo 'GPT Gate Stress Surface is triggered by workflow_run after this workflow completes successfully; no workflow-dispatch API call is required.'
