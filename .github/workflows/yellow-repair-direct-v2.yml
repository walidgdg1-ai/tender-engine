name: Direct YELLOW DCE Repair V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/yellow_repair_launch_v2.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: direct-yellow-dce-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repair dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests pypdf python-docx openpyxl python-pptx 'playwright>=1.46,<2'
          command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
            echo "Using preinstalled browser: $chrome"
          else
            python -m playwright install --with-deps chromium
          fi
          python -m py_compile pipeline/build_yellow_repair_queue.py

      - name: Reconstruct every requested YELLOW from durable local stores
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/build_yellow_repair_queue.py \
            --request control/yellow_repair_request.json \
            --out generated/dce_candidates.jsonl \
            --summary generated/yellow_repair_queue_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('generated/yellow_repair_queue_summary.json',encoding='utf-8'))
          rows=[x for x in Path('generated/dce_candidates.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          if s.get('missing_count') or s.get('unroutable_count'):
              raise SystemExit('Repair queue recovery is incomplete')
          if len(rows) != int(s.get('requested') or 0):
              raise SystemExit(f"Expected {s.get('requested')} routable repair rows, got {len(rows)}")
          Path('generated/repair_lines.txt').write_text(','.join(str(i) for i in range(1,len(rows)+1)),encoding='utf-8')
          print(f"YELLOW_REPAIR_READY requested={s['requested']} routable={len(rows)} resolvers={s.get('resolver_counts')}")
          PY

      - name: Force fresh DCE resolution for every reconstructed YELLOW
        env:
          DCE_FORCE_RETRY: '1'
          DCE_LOCAL_CONCURRENCY: '5'
          DCE_HTTP_LOCAL_CONCURRENCY: '16'
          DCE_PLACSP_LOCAL_CONCURRENCY: '4'
          DCE_HTTP_PROBE_CONCURRENCY: '16'
          DCE_HTTP_PROBE_TIMEOUT_SECONDS: '6'
          DCE_ITEM_RETRIES: '2'
          DCE_ITEM_TIMEOUT_SECONDS: '180'
        shell: bash
        run: |
          set -euo pipefail
          lines="$(cat generated/repair_lines.txt)"
          python pipeline/dce_batch_worker.py \
            --queue generated/dce_candidates.jsonl \
            --lines "$lines" \
            --out out \
            --concurrency 5 \
            --http-concurrency 16 \
            --placsp-concurrency 4 \
            --http-probe-concurrency 16 \
            --http-probe-timeout-seconds 6 \
            --retries 2 \
            --timeout-seconds 180

      - name: Rebuild evidence quality, mandatory gates and review rows
        shell: bash
        run: |
          set -euo pipefail
          DCE_EXTRACT_WORKERS=6 python pipeline/extract_corpus.py --root out
          python pipeline/dce_evidence_quality.py --root out
          DCE_GATE_WORKERS=6 python pipeline/extract_gates.py --root out
          python pipeline/aggregate_dce.py --root out --out repair-aggregate
          python pipeline/auto_adjudicate_dce.py \
            --queue repair-aggregate/deep_review_queue.jsonl \
            --out repair-adjudication \
            --max-model-reviews 0
          python pipeline/final_verdict_guard.py --review repair-adjudication/adjudication.jsonl
          python pipeline/durable_dce_pack.py --root out --out-dir durable
          python pipeline/slim_dce_output.py --root out --out slim

      - name: Build durable repair assets and metrics
        shell: bash
        run: |
          set -euo pipefail
          cp repair-adjudication/adjudication.jsonl fast-adjudication-shard-yellow-repair.jsonl
          cp repair-adjudication/summary.json fast-adjudication-summary-shard-yellow-repair.json
          cp repair-adjudication/supergreen_shortlist.json fast-supergreen-shortlist-shard-yellow-repair.json
          cp repair-aggregate/summary.json "dce-summary-${GITHUB_RUN_ID}.json"
          tar -C repair-aggregate -czf "dce-deep-review-${GITHUB_RUN_ID}.tar.gz" .
          tar -C durable -czf "dce-canonical-yellow-repair-${GITHUB_RUN_ID}.tar.gz" .
          tar -C slim -czf "dce-slim-yellow-repair-${GITHUB_RUN_ID}.tar.gz" .
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          q=json.load(open('generated/yellow_repair_queue_summary.json',encoding='utf-8'))
          agg=json.load(open('repair-aggregate/summary.json',encoding='utf-8'))
          rows=[]
          p=Path('repair-adjudication/adjudication.jsonl')
          if p.exists():
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      try: rows.append(json.loads(line))
                      except Exception: pass
          manifests=[]
          for path in Path('out').glob('*/manifest.json'):
              try:
                  x=json.load(open(path,encoding='utf-8'))
                  if isinstance(x,dict): manifests.append(x)
              except Exception: pass
          status=Counter(str(x.get('status') or 'UNKNOWN') for x in manifests)
          classes=Counter(str(r.get('classification') or r.get('final_class') or r.get('verdict') or 'UNKNOWN') for r in rows)
          metrics={
              'schema':'YELLOW_REPAIR_RUN_METRICS_V2',
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'queue_recovery':q,
              'aggregate_summary':agg,
              'manifest_count':len(manifests),
              'dce_status_counts':dict(status),
              'adjudication_rows':len(rows),
              'classification_counts':dict(classes),
          }
          Path('yellow-repair-metrics.json').write_text(json.dumps(metrics,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(metrics,ensure_ascii=False,indent=2))
          PY

      - name: Persist repair as canonical DCE harvest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dce-harvest-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "DCE Harvest ${GITHUB_RUN_ID} — YELLOW repair V2" \
            --notes "Fresh DCE repair for every live unresolved YELLOW reconstructed from durable local stores. Missing evidence remains UNKNOWN; no prior YELLOW is treated as terminal."
          gh release upload "$tag" \
            generated/dce_candidates.jsonl \
            generated/yellow_repair_queue_summary.json \
            yellow-repair-metrics.json \
            fast-adjudication-shard-yellow-repair.jsonl \
            fast-adjudication-summary-shard-yellow-repair.json \
            fast-supergreen-shortlist-shard-yellow-repair.json \
            "dce-summary-${GITHUB_RUN_ID}.json" \
            "dce-deep-review-${GITHUB_RUN_ID}.tar.gz" \
            "dce-canonical-yellow-repair-${GITHUB_RUN_ID}.tar.gz" \
            "dce-slim-yellow-repair-${GITHUB_RUN_ID}.tar.gz"
          gh release view "$tag" --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          grep -Fxq yellow-repair-metrics.json /tmp/assets.txt
          grep -Fxq fast-adjudication-shard-yellow-repair.jsonl /tmp/assets.txt

      - name: Persist compact repair state in repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          metrics=json.load(open('yellow-repair-metrics.json',encoding='utf-8'))
          state={
              'schema':'YELLOW_REPAIR_STATE_V3',
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'requested':metrics['queue_recovery']['requested'],
              'recovered_routable':metrics['queue_recovery']['recovered_routable'],
              'missing_count':metrics['queue_recovery']['missing_count'],
              'unroutable_count':metrics['queue_recovery']['unroutable_count'],
              'dce_status_counts':metrics['dce_status_counts'],
              'aggregate_summary':metrics['aggregate_summary'],
              'adjudication_rows':metrics['adjudication_rows'],
              'classification_counts':metrics['classification_counts'],
              'release_tag':f"dce-harvest-{os.environ['GITHUB_RUN_ID']}",
          }
          Path('control/yellow_repair_last_run.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/yellow_repair_last_run.json
          git commit -m "repair: persist direct YELLOW DCE V2 run ${GITHUB_RUN_ID}" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((i*2))"
          done
          exit 1

      - name: Best-effort downstream refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run gpt-review-full-backfill.yml --ref main || true
          gh workflow run gpt-inbox-live-refresh.yml --ref main || true
          gh workflow run dce-progress-ledger.yml --ref main -f dce_run_id="$GITHUB_RUN_ID" || true
