name: GPT Inbox Live Refresh

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["DCE Fanout V2"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'control/gpt_review_hot.json'
      - 'control/supergreen_hot.json'
      - 'control/qwen_dce_triage_latest.jsonl'
      - 'control/final_supergreen_bank.json'
      - 'control/gpt_web_review_ledger.json'
      - 'control/adjudications/*.json'
      - 'pipeline/post_dce_scope_gate.py'
      - 'pipeline/final_verdict_guard.py'
      - 'pipeline/refresh_gpt_inbox_live.py'
      - 'pipeline/gpt_web_tick.py'
      - 'pipeline/merge_gpt_adjudications_into_final_bank.py'
      - 'pipeline/rebuild_gpt_review_bank_from_release.py'
      - 'pipeline/build_gpt_review_index.py'
      - 'pipeline/refill_gpt_hot_from_index.py'
      - 'pipeline/build_gpt_web_read_batches.py'
      - 'pipeline/extract_corpus.py'
      - 'pipeline/extract_gates.py'
      - 'pipeline/auto_adjudicate_dce.py'
      - 'pipeline/build_authenticity_retry_router.py'
      - 'pipeline/mark_authenticity_retry_dispatched.py'
      - '.github/workflows/gpt-inbox-live-refresh.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && format('gpt-inbox-bot-{0}', github.run_id) || 'gpt-inbox-live-refresh' }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor != 'github-actions[bot]' ||
      endsWith(format('{0}', github.run_number), '0') ||
      endsWith(format('{0}', github.run_number), '5')
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recovery dependency
        run: python -m pip install --disable-pip-version-check -q requests

      - name: Recover immutable DCE shard verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dce-review-recovery
          mkdir -p /tmp/dce-review-recovery
          history=10
          if [ ! -s control/gpt_review_index.json ]; then
            history=50
          fi
          mapfile -t tags < <(
            gh release list --limit 100 --json tagName \
              --jq '.[] | select(.tagName | startswith("dce-harvest-")) | .tagName' \
              | head -n "$history"
          )
          if [ "${#tags[@]}" -eq 0 ]; then
            echo 'No DCE releases found.'
            exit 0
          fi
          for tag in "${tags[@]}"; do
            run_id="${tag#dce-harvest-}"
            mkdir -p "/tmp/dce-review-recovery/$run_id"
            gh release download "$tag" \
              --pattern 'fast-adjudication-shard-*.jsonl' \
              --dir "/tmp/dce-review-recovery/$run_id" || true
          done
          echo "Recovered releases=${#tags[@]} shard_files=$(find /tmp/dce-review-recovery -type f -name 'fast-adjudication-shard-*.jsonl' | wc -l)"

      - name: Rebuild uncapped index, rich review bank and GPT Web inbox transactionally
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'

          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main

            # Consume every durable GPT adjudication before rebuilding the work queue.
            # This makes the live refresh itself authoritative even if the separate
            # persistence workflow is delayed or starved by high-frequency main writes.
            python pipeline/merge_gpt_adjudications_into_final_bank.py
            python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          applied=[]
          for p in sorted(Path('control/adjudications').glob('*.json')):
              try:
                  obj=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if not isinstance(obj,dict) or obj.get('persist_to_final_bank') is not True:
                  continue
              results=[x for x in (obj.get('results') or []) if isinstance(x,dict) and x.get('candidate_id')]
              if not results:
                  continue
              subprocess.run([
                  sys.executable,
                  'pipeline/gpt_web_tick.py',
                  '--reviews', str(p),
                  '--ledger', 'control/gpt_web_review_ledger.json',
                  '--pass-id', f'persisted-adjudication:{p.stem}',
              ], check=True)
              applied.append({'file':str(p),'results':len(results)})
          print(json.dumps({'live_refresh_adjudications_ticked':applied},indent=2))
          PY

            python pipeline/build_gpt_review_index.py \
              --release-root /tmp/dce-review-recovery \
              --existing control/gpt_review_index.json \
              --final-bank control/final_supergreen_bank.json \
              --review-ledger control/gpt_web_review_ledger.json \
              --out control/gpt_review_index.json

            # Recent releases are still useful for a first hydrated bank, but they are
            # not the authoritative candidate universe.
            python pipeline/rebuild_gpt_review_bank_from_release.py \
              --release-root /tmp/dce-review-recovery \
              --existing control/gpt_review_hot.json \
              --out control/gpt_review_hot.json \
              --max-items 160

            # Starvation guard: refill the visible bank from the durable uncapped index
            # every pass. Older HOT/GOOD rows can no longer disappear merely because
            # their DCE release is outside the 10-release recovery window.
            python pipeline/refill_gpt_hot_from_index.py \
              --index control/gpt_review_index.json \
              --final-bank control/final_supergreen_bank.json \
              --review-ledger control/gpt_web_review_ledger.json \
              --out control/gpt_review_hot.json \
              --max-items 160 \
              --max-release-downloads 80

            # Force the refresh to read the just-updated LOCAL ledger rather than the
            # stale remote copy. The durable ledger is committed below in the same run.
            GH_TOKEN='' GITHUB_TOKEN='' python pipeline/refresh_gpt_inbox_live.py \
              --existing control/gpt_supergreen_inbox.json \
              --final-bank control/final_supergreen_bank.json \
              --hot-green control/supergreen_hot.json \
              --hot-review control/gpt_review_hot.json \
              --review-ledger control/gpt_web_review_ledger.json \
              --out control/gpt_supergreen_inbox.json \
              --max-items 160

            python pipeline/build_gpt_web_read_batches.py \
              --inbox control/gpt_supergreen_inbox.json \
              --provenance-overrides control/gpt_provenance_overrides.json \
              --out-dir control/gpt_web_read_batches \
              --batch-size 10

            python - <<'PY'
          import json
          from datetime import datetime, timezone
          inbox=json.load(open('control/gpt_supergreen_inbox.json',encoding='utf-8'))
          review=json.load(open('control/gpt_review_hot.json',encoding='utf-8'))
          index=json.load(open('control/gpt_review_index.json',encoding='utf-8'))
          manifest=json.load(open('control/gpt_web_read_batches/manifest.json',encoding='utf-8'))
          idx_counts=index.get('counts') or {}
          inbox_schema=str(inbox.get('schema') or '')
          payload={
            'schema':'GPT_INBOX_HEALTH_V4_FAIR_SHARE_PROVENANCE',
            'updated_at':datetime.now(timezone.utc).isoformat(),
            'inbox_schema':inbox_schema,
            'latest_source_dce_run_id':inbox.get('latest_source_dce_run_id'),
            'counts':inbox.get('counts') or {},
            'window_selection':inbox.get('window_selection') or {},
            'review_bank_count':review.get('count'),
            'review_bank_schema':review.get('schema'),
            'review_bank_window_selection':review.get('window_selection') or {},
            'review_index_count':int(index.get('count') or 0),
            'review_index_counts':idx_counts,
            'true_pending_before_hot_cap':int(idx_counts.get('pending_total_uncapped') or 0),
            'overflow_beyond_hot_160':int(idx_counts.get('overflow_beyond_hot_160') or 0),
            'assistant_read_batch_count':int(manifest.get('batch_count') or 0),
            'assistant_read_batch_size':int(manifest.get('batch_size') or 0),
            'assistant_read_batch_schema':manifest.get('schema'),
            'provenance_overrides_applied_in_window':int(manifest.get('provenance_overrides_applied_in_window') or 0),
            'recovery_metrics':review.get('recovery_metrics') or {},
            'index_recovery':index.get('recovery') or {},
            'healthy':inbox_schema in {'GPT_WEB_REVIEW_INBOX_V2','GPT_WEB_REVIEW_INBOX_V3_FAIR_SHARE'} and int(index.get('count') or 0)>0,
            'contract':'Health sidecar exposes the true uncapped GPT review backlog plus fair-share and read-surface provenance. GPT Web adjudicator remains the assistant; exact-ID authenticity retries are separately cooldown-limited below.',
          }
          open('control/gpt_inbox_metrics.json','w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY

            git add \
              control/final_supergreen_bank.json \
              control/gpt_web_review_ledger.json \
              control/gpt_review_index.json \
              control/gpt_review_hot.json \
              control/gpt_supergreen_inbox.json \
              control/gpt_inbox_metrics.json
            git add -A control/gpt_web_read_batches
            if git diff --cached --quiet; then
              echo 'Persistent GPT bank, ledger, review index, rich bank, batches and inbox already current.'
              break
            fi

            git commit -m "inbox: consume GPT adjudications and recover review window ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$n" -eq 6 ]; then
              echo 'Failed to persist recovered GPT inbox after retries.' >&2
              exit 1
            fi
            sleep "$((n * 2))"
          done

      - name: Dispatch only cooldown-safe authenticity retries from the live inbox
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python pipeline/build_authenticity_retry_router.py \
            --inbox control/gpt_supergreen_inbox.json \
            --state control/authenticity_retry_router_state.json \
            --plan control/authenticity_retry_router_plan.json \
            --limit-per-source 12 \
            --max-attempts 2 \
            --cooldown-days 7

          total="$(python - <<'PY'
          import json
          x=json.load(open('control/authenticity_retry_router_plan.json',encoding='utf-8'))
          print(sum(int(v or 0) for v in (x.get('selected_counts') or {}).values()))
          PY
          )"
          if [ "$total" -eq 0 ]; then
            echo 'No cooldown-safe supported authenticity retries.'
            exit 0
          fi

          source_run="$(python - <<'PY'
          import json
          x=json.load(open('control/live_snapshot_latest.json',encoding='utf-8'))
          print(x.get('source_discovery_run') or '')
          PY
          )"
          [[ "$source_run" =~ ^[0-9]+$ ]] || { echo "Invalid live discovery run: $source_run" >&2; exit 1; }

          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/authenticity_retry_router_plan.json \
            queues/ireland_auth_retry_router.jsonl \
            queues/za_auth_retry_router.jsonl \
            queues/estonia_auth_retry_router.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "retry: materialize stateful authenticity queues ${GITHUB_RUN_ID}"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              git rebase --abort >/dev/null 2>&1 || true
              [ "$i" -eq 5 ] && exit 1
              sleep "$((i*3))"
            done
          fi

          success=()
          dispatch_failed=0
          while IFS=$'\t' read -r source queue count; do
            [ "$count" -gt 0 ] || continue
            if gh workflow run dce-fanout-v2.yml --ref main \
              -f selection_path="$queue" \
              -f source_discovery_run="$source_run" \
              -f max_jobs="$count" \
              -f max_parallel='8' \
              -f max_shards='32' \
              -f jobs_per_shard='1'; then
              success+=("$source")
            else
              echo "Authenticity retry dispatch failed source=$source queue=$queue" >&2
              dispatch_failed=1
            fi
          done < <(python - <<'PY'
          import json
          x=json.load(open('control/authenticity_retry_router_plan.json',encoding='utf-8'))
          for source,count in (x.get('selected_counts') or {}).items():
              print(f"{source}\t{(x.get('queue_paths') or {}).get(source,'')}\t{int(count or 0)}")
          PY
          )

          if [ "${#success[@]}" -gt 0 ]; then
            joined="$(IFS=,; echo "${success[*]}")"
            git pull --rebase origin main || true
            python pipeline/mark_authenticity_retry_dispatched.py \
              --plan control/authenticity_retry_router_plan.json \
              --state control/authenticity_retry_router_state.json \
              --sources "$joined"
            git add control/authenticity_retry_router_state.json
            if ! git diff --cached --quiet; then
              git commit -m "retry: persist authenticity cooldown state ${GITHUB_RUN_ID}"
              for i in 1 2 3 4 5; do
                git pull --rebase origin main && git push origin HEAD:main && break
                git rebase --abort >/dev/null 2>&1 || true
                [ "$i" -eq 5 ] && exit 1
                sleep "$((i*3))"
              done
            fi
          fi
          [ "$dispatch_failed" -eq 0 ] || exit 1
